<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      header {
        border: solid;
      }

      .burger {
        display: none; /* на компьютере бургер скрыт! */
        flex-direction: column;
        gap: 5px;
        cursor: pointer;
      }

      .burger span {
        display: inline-block;
        width: 25px;
        height: 3px;
        background-color: black;
        transition: 0.3s;
        border-radius: 1.5px;
      }

      nav {
        transition: 0.5s;
      }

      @media (max-width: 768px) {
        .burger{
            display: flex;
            border: solid;
        }

        nav {
            display: flex;

            flex-direction: column;
            position: absolute;
            top: 80px;
            left: 0;
            width: 100%;
            background-color: white;
            padding: 20px;
            text-align: center;
            gap: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);


            /* top: -300px;  */
            opacity: 0;
            transition: 0.4s;
            pointer-events: none;
        }

        nav.active {
            top: 80px;
            opacity: 1;
            pointer-events: auto;
        }

        .burger.active span:nth-child(1){
            transform: translateY(8px) rotate(45deg);
        }

        .burger.active span:nth-child(2){
            opacity: 0;
        }

        .burger.active span:nth-child(3){
            transform: translateY(-8px) ;
        }

        nav.active {
            display: flex;
            transition: 0.5s;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>LOGO</h1>
      <nav>
        <a href="https://prezi-monday.vercel.app/month-1/lesson-12/lesson-12.html">......</a>
        <a href="https://prezi-monday.vercel.app/month-1/lesson-12/lesson-12.html">......</a>
        <a href="https://prezi-monday.vercel.app/month-1/lesson-12/lesson-12.html">......</a>
        <a href="https://prezi-monday.vercel.app/month-1/lesson-12/lesson-12.html">......</a>
        <a href="https://prezi-monday.vercel.app/month-1/lesson-12/lesson-12.html">......</a>
      </nav>

      <div class="btns">
        <button>Log in</button>
        <button>Sign up</button>
      </div>
      <div class="burger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </header>

    <script>
      const burger = document.querySelector(".burger");
      const nav = document.querySelector("nav");

      burger.addEventListener("click", () => {
        burger.classList.toggle("active");
        nav.classList.toggle("active");
      });
    </script>
  </body>
</html>
